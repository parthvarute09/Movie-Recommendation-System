<!DOCTYPE html>
<html>
<head>
    <title>CINEMATCH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>CINEMATCH</h1>

    <form method="POST">
        <select name="movie">
            {% for movie in movies %}
                <option value="{{ movie }}" {% if movie == selected %}selected{% endif %}>{{ movie }}</option>
            {% endfor %}
        </select>
        <button type="submit">Get Recommendations</button>
    </form>

    {% if recommendations %}
    <h2>Because you liked {{ selected }}...</h2>
    <div class="recommendations">
        {% for rec in recommendations %}
        <div class="card">
            <img src="{{ rec.poster }}" alt="{{ rec.original_title }}">
            <h3>{{ rec.original_title }}</h3>
            <p>⭐ {{ rec.vote_average }}</p>
            <p>{{ rec.genres }}</p>
            <p>{{ rec.overview }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
